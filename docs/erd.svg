<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="crow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="380" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="700" fill="#0f172a">CryptoAssist — ER-диаграмма</text>
  <text x="20" y="50" font-size="12" fill="#64748b">PostgreSQL 15 · SQLAlchemy ORM · sessions 1—N tickets 1—N messages</text>

  <!-- sessions -->
  <g>
    <rect x="30" y="130" width="230" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="30" y="130" width="230" height="32" rx="8" fill="#3b82f6"/>
    <rect x="30" y="146" width="230" height="16" fill="#3b82f6"/>
    <text x="145" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">sessions</text>
    <text x="46" y="188" font-size="12.5" fill="#0f172a">🔑 id : String (PK, UUID4)</text>
    <text x="46" y="212" font-size="11.5" fill="#64748b">без других полей —</text>
    <text x="46" y="228" font-size="11.5" fill="#64748b">ни status, ни created_at</text>
  </g>

  <!-- tickets -->
  <g>
    <rect x="390" y="90" width="260" height="220" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="390" y="90" width="260" height="32" rx="8" fill="#16a34a"/>
    <rect x="390" y="106" width="260" height="16" fill="#16a34a"/>
    <text x="520" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">tickets</text>
    <text x="406" y="146" font-size="12.5" fill="#0f172a">🔑 id : String (PK), напр. CEX-1234</text>
    <text x="406" y="168" font-size="12.5" fill="#0f172a">🔗 session_id : String (FK → sessions.id)</text>
    <text x="406" y="190" font-size="12.5" fill="#0f172a">category : String (default "Другое")</text>
    <text x="406" y="212" font-size="12.5" fill="#0f172a">tags : JSON (default [])</text>
    <text x="406" y="234" font-size="12.5" fill="#0f172a">status : String (open/closed/</text>
    <text x="420" y="250" font-size="12.5" fill="#0f172a">needs_specialist)</text>
    <text x="406" y="272" font-size="12.5" fill="#0f172a">rate : Integer, nullable (1–5)</text>
    <text x="406" y="294" font-size="12.5" fill="#0f172a">created_at : DateTime</text>
  </g>

  <!-- messages -->
  <g>
    <rect x="760" y="110" width="210" height="180" rx="8" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="760" y="110" width="210" height="32" rx="8" fill="#a855f7"/>
    <rect x="760" y="126" width="210" height="16" fill="#a855f7"/>
    <text x="865" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">messages</text>
    <text x="776" y="166" font-size="12.5" fill="#0f172a">🔑 id : String (PK, UUID4)</text>
    <text x="776" y="188" font-size="12.5" fill="#0f172a">🔗 ticket_id : String</text>
    <text x="790" y="204" font-size="12.5" fill="#0f172a">(FK → tickets.id)</text>
    <text x="776" y="226" font-size="12.5" fill="#0f172a">sender : String</text>
    <text x="790" y="242" font-size="12.5" fill="#0f172a">(user/bot/admin)</text>
    <text x="776" y="264" font-size="12.5" fill="#0f172a">text : Text</text>
    <text x="776" y="282" font-size="11.5" fill="#0f172a">created_at : DateTime</text>
  </g>

  <!-- relation sessions -> tickets: line sits alone, labels well clear above/below -->
  <line x1="260" y1="185" x2="388" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="272" y="175" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="368" y="175" font-size="12" font-weight="600" fill="#334155">N</text>
  <text x="324" y="202" text-anchor="middle" font-size="10.5" fill="#94a3b8">cascade delete-orphan</text>

  <!-- relation tickets -> messages -->
  <line x1="650" y1="200" x2="758" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#crow)"/>
  <text x="662" y="190" font-size="12" font-weight="600" fill="#334155">1</text>
  <text x="738" y="190" font-size="12" font-weight="600" fill="#334155">N</text>
  <text x="704" y="217" text-anchor="middle" font-size="10.5" fill="#94a3b8">cascade delete-orphan</text>

  <text x="20" y="345" font-size="11.5" fill="#94a3b8">confidence_score, is_final, text бота — вычисляемые поля ответа LLM-роутера, в БД не хранятся (см. README → «Логика LLM-роутера»).</text>
</svg>
